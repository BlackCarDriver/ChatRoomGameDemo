<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>围棋 / 五子棋 / 象棋 · 插件房接入 Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    /* 半透明底色：让插件房外壳的背景（房间背景图）透出来 */
    background: rgba(27, 29, 36, .78); color: #eaeaea;
  }
  /* 固定 1024x768（4:3）设计画布：由 JS 按视口等比缩放，
     任意窗口尺寸下内容与棋盘的比例都保持一致。
     用 left/top 50% + translate(-50%,-50%) 把画布中心钉在视口中心，
     再 scale() 围绕该点缩放，避免超大盒子被 flex 居中时的对齐退化。 */
  .page {
    position: fixed; left: 50%; top: 50%;
    width: 1024px; height: 768px;
    padding: 16px 16px 12px;
    transform-origin: center;
    display: flex; flex-direction: column; gap: 12px;
  }
  /* 顶部栏：左（轮次/倒计时）+ 中（玩法切换）+ 右（连接状态） */
  .topbar {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 8px; min-height: 28px;
  }
  .topbarSide { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topbarLeft { overflow: hidden; white-space: nowrap; }
  .topbarRight { justify-content: flex-end; overflow: hidden; }
  .topbarCenter { justify-self: center; }
  .turn { font-weight: 600; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; }
  .dot.black { background: #111; border: 1px solid #888; }
  .dot.white { background: #fff; }
  /* 象棋：先手为红方（对应座位 1），后手黑方 */
  .dot.red { background: #c0271f; border: 1px solid #e08a80; }
  /* 将军提示 */
  .checkFlag {
    color: #ff4d4f; font-weight: 800; font-size: 14px;
    padding: 0 8px; border-radius: 9px;
    background: rgba(255, 77, 79, .16);
    border: 1px solid rgba(255, 77, 79, .45);
    animation: myTurnPulse 1s ease-in-out infinite;
  }
  .checkFlag[hidden] { display: none; }
  /* 轮到我落子时的提示 */
  .myTurn {
    color: #ff4d4f; font-weight: 700; font-size: 14px;
    animation: myTurnPulse 1.6s ease-in-out infinite;
  }
  @keyframes myTurnPulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  /* stretch：让侧栏撑满布局可用高度，聊天区才能占满剩余空间 */
  .layout { display: flex; gap: 16px; align-items: stretch; flex: 1 1 auto; min-height: 0; }
  /* 棋盘列：包裹棋盘（标注在棋盘顶部木质边距内，不占额外高度） */
  .boardCol {
    display: flex; flex-direction: column; align-items: center;
    flex: 0 0 686px;
  }
  /* 当前玩法标注：显眼但自然，放在棋盘顶部木质边距内 */
  .modeLabel {
    position: absolute; left: 50%; top: 10px;
    transform: translateX(-50%);
    z-index: 5; pointer-events: none;
    font-size: 28.8px; font-weight: 700; line-height: 1.1;
    letter-spacing: .5em; text-indent: .5em;
    color: #e6c889;
    font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
    white-space: nowrap;
  }
  .boardWrap {
    position: relative; flex: 0 0 auto; width: 686px; height: 700px;
    background: #d9a441; border-radius: 6px; padding: 6%;
  }
  /* ==================== 竖屏（9:16 画布）：纵向布局 ==================== */
  /* 顶部信息分两行：左（轮次/用时）+ 右（连接状态），第二行居中放玩法切换 */
  .page.is-portrait .topbar {
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    row-gap: 6px;
  }
  .page.is-portrait .topbarLeft { grid-column: 1; grid-row: 1; }
  .page.is-portrait .topbarRight { grid-column: 2; grid-row: 1; }
  .page.is-portrait .topbarCenter { grid-column: 1 / -1; grid-row: 2; justify-self: center; }
  /* 主布局改为纵向：棋盘在上，席位/聊天在下 */
  .page.is-portrait .layout {
    flex-direction: column;
    gap: 12px;
    /* 空间不足时（例如 3:4 画布）允许纵向拖动，查看底部的席位与聊天区 */
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .page.is-portrait .boardCol {
    flex: 0 0 auto;
    width: 100%;
  }
  /* 竖屏：压缩页边距，把宽度尽量留给棋盘 */
  .page.is-portrait { padding: 8px 8px 6px; }
  /* 棋盘占满内容宽度并保持正方形 */
  .page.is-portrait .boardWrap {
    width: 100%; height: auto;
    aspect-ratio: 1 / 1;
    /* 手机屏幕窄，木质边距从 6% 收到 4%，网格随之变大 */
    padding: 4%;
  }
  .page.is-portrait .grid { inset: 4%; }
  /* 标注要放得进收窄后的木质边距 */
  .page.is-portrait .modeLabel {
    top: 1px;
    font-size: 18px;
    letter-spacing: .3em;
    text-indent: .3em;
  }
  /* 侧栏整宽；空间够时自然撑开，空间不足时保持最小可用高度并交给外层滚动 */
  .page.is-portrait .side {
    flex: 0 0 auto;
    width: auto;
    min-height: 300px;
  }
  /* 竖屏空间紧：席位区收紧（小头像、小内距、小按钮） */
  .page.is-portrait .playersCard { padding: 1.5em 10px 8px; }
  .page.is-portrait .seatList { gap: 8px; }
  .page.is-portrait .seatSlot { padding: 22px 6px 6px; gap: 4px; }
  .page.is-portrait .seatSlot .avatarWrap { font-size: 11.5px; }
  .page.is-portrait .seatName { font-size: 11.5px; }
  .page.is-portrait .seatStatus { height: 15px; font-size: 10.5px; }
  .page.is-portrait .seatActions { margin-top: 6px; gap: 4px; }
  .page.is-portrait .seatActions button { padding: 4px 0; font-size: 11px; }
  .page.is-portrait .playersCard .result { margin-top: 4px; font-size: 11px; }
  /* 观战成员与游戏内聊天：同一行两列（观战窄、聊天宽），固定高度保证可滚动查看 */
  .page.is-portrait .sideBottom { flex: 0 0 auto; flex-direction: row; gap: 8px; height: 190px; }
  .page.is-portrait .watchersCard { flex: 0 0 33%; }
  .page.is-portrait .chatCard { flex: 1 1 auto; }
  .page.is-portrait .watchersCard .sectionTitle,
  .page.is-portrait .chatCard .sectionTitle { font-size: 12px; margin-bottom: 6px; }
  .page.is-portrait .watcher { width: 3em; }
  .page.is-portrait .watcher .avatarWrap { width: 2em; height: 2em; }
  .page.is-portrait .watcherNick { font-size: 10px; }
  .page.is-portrait .log { font-size: 12px; line-height: 1.5; }

  /* 象棋：网格按 9:10 居中，顶部木边留白较少，标注略微上移、缩小 */
  .boardWrap.isXq .modeLabel { top: 4px; font-size: 26px; }
  .page.is-portrait .boardWrap.isXq .modeLabel { top: 0; font-size: 16px; letter-spacing: .2em; text-indent: .2em; }

  .grid {
    position: absolute; inset: 6%;
    display: grid; grid-template-columns: repeat(var(--cols, 19), 1fr); grid-template-rows: repeat(var(--rows, 19), 1fr);
    /* 落子用点击；纵向拖动交给外层滚动（竖屏查看底部席位/聊天），同时禁止双指缩放 */
    touch-action: pan-y;
  }
  /* 象棋：9 列 × 10 行，格子必须是正方形，网格整体按 9:10 居中放进棋盘 */
  .grid.isXq {
    inset: auto; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    height: 88%; width: auto;
    aspect-ratio: 9 / 10;
  }
  .page.is-portrait .grid.isXq {
    height: 92%;
    inset: auto;
    left: 50%;
    top: 50%;
  }
  /* 象棋：河界处竖线断开（最左/最右两路仍贯通），形成楚河汉界 */
  .grid.isXq .point.riverAbove::after { bottom: 50%; }
  .grid.isXq .point.riverBelow::after { top: 50%; }
  .point { position: relative; display: flex; align-items: center; justify-content: center; cursor: default; }
  .grid.canPlay .point { cursor: pointer; }
  .point::before, .point::after { content: ''; position: absolute; background: #6d5320; }
  /* 横线：默认铺满整格；最左/最右一列只画到交点，保证最外圈平整不冒头 */
  .point::before { left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%); }
  .point.edgeL::before { left: 50%; }
  .point.edgeR::before { right: 50%; }
  /* 竖线：同上，最上/最下一行只画到交点 */
  .point::after { top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%); }
  .point.edgeT::after { top: 50%; }
  .point.edgeB::after { bottom: 50%; }
  /* 最外一圈线加粗 */
  .point.edgeT::before, .point.edgeB::before { height: 3px; }
  .point.edgeL::after, .point.edgeR::after { width: 3px; }
  /* 星位小圆点 */
  .starDot {
    position: absolute; left: 50%; top: 50%;
    width: 26%; height: 26%; min-width: 4px; min-height: 4px;
    transform: translate(-50%, -50%);
    border-radius: 50%; background: #6d5320;
    z-index: 1; pointer-events: none;
  }
  .stone {
    position: relative; z-index: 2;
    width: 88%; height: 88%; border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .stone.black { background: radial-gradient(circle at 32% 30%, #555, #000); }
  .stone.white { background: radial-gradient(circle at 32% 30%, #fff, #ccc); }
  /* 象棋棋子：木纹圆盘底图（红/黑两侧由服务端下发）+ 中央汉字。
     底图中心为奶油底色，深色双圈在半径约 60~94% 处，
     汉字字号按格子缩放且要落进内圈：字号 0.5*格子 → 字半宽约 54% 半径，不压环。 */
  .piece {
    position: relative; z-index: 2;
    width: 92%; height: 92%; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    /* 底图优先；底图加载失败时退回木纹渐变 */
    background:
      var(--piece-img, none) center / 100% 100% no-repeat,
      radial-gradient(circle at 34% 26%, #fff9e9, #f0dcb4 62%, #dcc08c 100%);
    box-shadow: 0 1px 3px rgba(0,0,0,.45);
    font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    font-weight: 700; line-height: 1; user-select: none; pointer-events: none;
    font-size: calc(var(--cell, 40px) * .475);
  }
  .piece.red {
    --piece-img: url('https://nichijou-1300531302.cos.ap-guangzhou.myqcloud.com/game/red3.webp');
    color: #a32016;
  }
  .piece.black {
    --piece-img: url('https://nichijou-1300531302.cos.ap-guangzhou.myqcloud.com/game/black3.webp');
    color: #23262b;
  }
  /* 汉字包在 span 里做光学居中：flex 居中的是整行盒，
     中文字体的字形重心略偏下，整体上移 1/5 字号高度与底图圆心对齐 */
  .piece > span {
    display: block;
    transform: translateY(calc(-.07em - 1px));
  }
  /* 选中的棋子 */
  .point.selected .piece {
    box-shadow: 0 0 0 3px #ffd479, 0 2px 6px rgba(0,0,0,.5);
  }
  /* 可走点提示：空点画小圆点，有敌子画外圈 */
  .moveTip {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 26%; height: 26%; min-width: 5px; min-height: 5px;
    border-radius: 50%; background: rgba(61, 111, 214, .6);
    z-index: 3; pointer-events: none;
  }
  .point.target.hasPiece .moveTip {
    width: 92%; height: 92%; background: transparent;
    border: 2px solid rgba(61, 111, 214, .85);
  }
  /* 上一步移动的棋子：金色光晕发光提示（替代原来的起点/终点标记框） */
  .point.lastMove .piece {
    box-shadow: 0 0 8px 3px rgba(255, 212, 121, .75), 0 1px 3px rgba(0,0,0,.45);
    animation: lastGlow 1.2s ease-in-out infinite;
  }
  @keyframes lastGlow {
    0%, 100% { box-shadow: 0 0 6px 2px rgba(255, 212, 121, .5), 0 1px 3px rgba(0,0,0,.45); }
    50% { box-shadow: 0 0 16px 6px rgba(255, 212, 121, 1), 0 1px 3px rgba(0,0,0,.45); }
  }
  /* 被将军的将帅 */
  .point.inCheck .piece {
    box-shadow: 0 0 0 3px #ff4d4f, 0 0 12px rgba(255, 77, 79, .8);
    animation: myTurnPulse 1s ease-in-out infinite;
  }
  /* 象棋棋盘装饰（九宫斜线、炮位标记、楚河汉界），用 SVG 叠加在网格上 */
  .boardArt {
    position: absolute; inset: 0; width: 100%; height: 100%;
    overflow: visible; pointer-events: none; z-index: 0;
  }
  .boardArt line { stroke: #6d5320; stroke-width: .033; stroke-linecap: round; }
  .boardArt text {
    fill: #7a5c22;
    font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    letter-spacing: .08em;
  }
  /* 鼠标悬停的半透明落子预览 */
  .stone.previewStone { z-index: 3; opacity: .45; pointer-events: none; }
  .point.last .stone::after {
    content: ''; position: absolute; inset: 38%; border-radius: 50%; background: #e33;
  }
  /* 侧栏收窄并贴右，给左边棋盘让空间 */
  .side { flex: 0 0 290px; width: 290px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  /* 观战 + 聊天容器：横屏纵向排列（聊天占满剩余），竖屏改横向两列 */
  .sideBottom { display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; min-height: 0; }
  .card { background: #262933; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  /* 座位区顶部留白，给头像上的聊天气泡腾位置 */
  .playersCard { padding-top: 2.4em; overflow: visible; }
  .seatList { display: flex; gap: 8px; }
  .seatSlot {
    flex: 1 1 0; min-width: 0; position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 28px 6px 8px; border-radius: 10px; background: #2f333f;
    border: 1px solid transparent; cursor: pointer;
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .seatSlot:hover { background: #373c49; }
  .seatSlot.isOccupied { cursor: default; }
  /* 右上角用颜色标记黑白方 */
  .seatColorBadge {
    position: absolute; top: 6px; right: 6px;
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid #8d93a1;
  }
  .seatColorBadge.black { background: #111; }
  .seatColorBadge.white { background: #fff; }
  .seatColorBadge.red { background: #c0271f; border-color: #e08a80; }
  /* 蓝框表示当前该谁落子 */
  .seatSlot.isTurn {
    border-color: #3d6fd6;
    box-shadow: 0 0 0 1px rgba(61, 111, 214, .55), 0 0 14px rgba(61, 111, 214, .35);
  }
  .seatName {
    max-width: 100%; font-size: 12px; color: #b9bdc7;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .seatSlot.isOccupied .seatName { color: #eaeaea; }
  /* 座位状态行：固定高度，准备/悔棋文案出现或消失都不会改变容器高度 */
  .seatStatus {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 16px; max-width: 100%;
    font-size: 11.5px; font-weight: 600; line-height: 1;
    overflow: hidden; white-space: nowrap;
  }
  /* 已准备标记 */
  .seatReady { color: #7ee787; letter-spacing: .05em; }
  /* 已悔棋次数（红字） */
  .seatUndo {
    color: #ff5b5b;
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  /* 操作按钮：头像/座位区下方排成一行 */
  .seatActions { display: flex; gap: 4px; margin-top: 10px; }
  .seatActions button {
    flex: 1 1 0; min-width: 0;
    padding: 6px 0; font-size: 11.5px;
    white-space: nowrap; letter-spacing: -.3px;
  }
  .playersCard .result { margin-top: 8px; font-size: 12px; text-align: center; }

  /* 头像 + 头像框（与聊天室 AvatarBox 同款结构：框整体放大 1.35 倍） */
  .avatarHost { position: relative; }
  .avatarWrap {
    position: relative; width: 3.2em; height: 3.2em; border-radius: 50%;
    transition: transform .25s ease;
  }
  .seatSlot .avatarWrap { font-size: 14px; }
  .avatarImg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border-radius: 50%; object-fit: cover;
    background: #3b3f4c; border: 2px solid #fff; box-sizing: border-box;
  }
  .avatarFallback {
    position: absolute; inset: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #3b3f4c; border: 2px dashed #6d7383; color: #9aa0af;
    font-size: 1.1em; text-transform: uppercase;
  }
  .frameImg {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    transform: scale(1.35); pointer-events: none;
  }
  /* 轮到谁落子，谁的头像放大，另一方缩小 */
  .seatSlot.isTurn .avatarWrap { transform: scale(1.16); }
  .seatSlot.isTurn .seatName { color: #ffd479; font-weight: 600; }
  .seatSlot.isOther .avatarWrap { transform: scale(.84); opacity: .75; }

  /* 聊天气泡：白底圆角 + 底部尖角朝下（对齐音乐房气泡）。
     外层不再 overflow:hidden，尖角才能露出；两行裁剪放到内部 .bubbleText */
  .bubble {
    position: absolute; left: 50%; bottom: calc(100% + 8px);
    /* 绝对定位在窄锚点内会被压成一条竖线，用 max-content 让宽度跟随内容 */
    width: max-content; max-width: 10em;
    padding: .4em .7em; border-radius: 10px;
    background: #fff; color: #2a2c33;
    font-size: 12px; line-height: 1.4; text-align: left;
    box-shadow: 0 4px 12px rgba(0,0,0,.16);
    opacity: 0; pointer-events: none; z-index: 30;
    transform: translateX(-50%) scale(.9);
    transition: opacity .15s ease, transform .15s ease;
  }
  /* 消息文本：最多两行省略号（完整内容看下方聊天记录） */
  .bubbleText {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    word-break: break-word;
  }
  /* 尖角：白色菱形悬在气泡底部中央，指向头像 */
  .bubbleArrow {
    position: absolute; left: 50%; bottom: -5px;
    width: 10px; height: 10px; border-radius: 2px;
    background: #fff;
    transform: translateX(-50%) rotate(45deg);
    z-index: -1;
  }
  .bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }

  .sectionTitle { font-size: 12px; color: #8b90a0; margin-bottom: 8px; }
  .watcherList { display: flex; flex-wrap: wrap; gap: 8px; }
  .watcher {
    position: relative; width: 3.6em;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .watcher .avatarWrap { width: 2.4em; height: 2.4em; }
  .watcher .bubble { max-width: 12em; }
  .watcherNick {
    max-width: 100%; font-size: 11px; color: #b9bdc7;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .emptyHint { font-size: 12px; color: #6f7484; }

  button {
    padding: 6px 12px; border: 0; border-radius: 6px; cursor: pointer;
    background: #3d6fd6; color: #fff; font-size: 13px;
  }
  button.ghost { background: #3a3e4a; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  /* 聊天卡片占满侧栏剩余高度，log 内部滚动 */
  .chatCard {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .log { flex: 1 1 auto; max-height: none; min-height: 0; overflow-y: auto; font-size: 12px; line-height: 1.6; color: #b9bdc7; }
  .chatRow { display: flex; gap: 6px; align-items: baseline; }
  .chatTime { flex: 0 0 auto; color: #6f7484; font-variant-numeric: tabular-nums; }
  /* 游戏事件行（对局开始/吃子/结束）：金色系统消息 */
  .chatRow.eventRow { color: #e6c889; }
  .chatRow.eventRow .chatTime { color: #8d7a45; }
  .result { font-weight: 600; color: #ffd479; }
  .toast {
    position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    background: rgba(200, 60, 60, .95); color: #fff; padding: 8px 16px;
    border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
  .hint { font-size: 12px; color: #8b90a0; }

  /* 右下角全屏按钮 */
  .fsBtn {
    position: absolute; right: 16px; bottom: 16px; z-index: 90;
    width: 40px; height: 40px; padding: 0; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(38, 41, 51, .82); color: #eaeaea;
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);

  }
  .fsBtn:hover { background: rgba(61, 111, 214, .92); }
  .fsBtn:active { transform: scale(.92); }
  .fsBtn svg { width: 20px; height: 20px; display: block; }
  /* 进入全屏后只显示“退出全屏”图标 */
  .fsBtn .iconExit { display: none; }
  .fsBtn.isFullscreen .iconEnter { display: none; }
  .fsBtn.isFullscreen .iconExit { display: block; }

  /* 玩法切换（围棋 / 五子棋） */
  .modeSwitch {
    display: inline-flex; gap: 2px; padding: 2px;
    background: #2b2f3a; border-radius: 999px;
  }
  .modeBtn {
    padding: 3px 10px; border: 0; border-radius: 999px;
    background: transparent; color: #9aa0af;
    font-size: 12px; line-height: 1.4; cursor: pointer;
  }
  .modeBtn:hover { color: #eaeaea; }
  .modeBtn.isActive { background: #3d6fd6; color: #fff; }
  .modeBtn:disabled { cursor: not-allowed; opacity: .55; }

  /* 顶部：本局用时 */
  .gameTime {
    font-size: 13px; font-weight: 600; color: #b9bdc7;
    padding: 1px 8px; border-radius: 10px; background: #2b2f3a;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  /* 回合倒计时：显示在当前出棋人的座位头像上方 */
  .turnClock {
    position: absolute; left: 50%; top: 2px;
    transform: translateX(-50%);
    font-size: 11px; font-weight: 700; color: #ffd479;
    padding: 1px 7px; border-radius: 8px;
    /* 浅色半透明底，避免深色块压住头像 */
    background: rgba(255, 255, 255, .16);
    border: 1px solid rgba(255, 255, 255, .24);
    white-space: nowrap; z-index: 20;
  }
  .turnClock.isUrgent {
    color: #ff4d4f;
    animation: myTurnPulse 1s ease-in-out infinite;
  }

  /* 终局结果弹窗 */
  .resultOverlay {
    position: absolute; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10, 11, 16, .62);
    animation: overlayIn .22s ease both;
  }
  .resultOverlay[hidden] { display: none; }
  .resultCard {
    position: relative; width: min(88vw, 340px);
    padding: 20px 20px 18px; border-radius: 16px; text-align: center;
    background: linear-gradient(180deg, #313748, #232734);
    border: 1px solid rgba(255, 255, 255, .09);
    box-shadow: 0 18px 48px rgba(0, 0, 0, .55);
    animation: cardPop .45s cubic-bezier(.2, 1.4, .4, 1) both;
    overflow: hidden;
  }
  .resultBadge {
    font-size: 11px; letter-spacing: .32em; color: #8b90a0;
    margin-bottom: 8px; text-indent: .32em;
  }
  .resultHeadline { font-size: 24px; font-weight: 800; line-height: 1.25; }
  .resultHeadline.isWin { color: #ffd479; text-shadow: 0 0 18px rgba(255, 212, 121, .45); }
  .resultHeadline.isLose { color: #9aa0af; }
  .resultHeadline.isDraw { color: #9fd0ff; }
  .resultDetail { margin-top: 8px; font-size: 13px; color: #b9bdc7; line-height: 1.6; }
  .resultActions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  .resultFx { position: absolute; inset: 0; pointer-events: none; }
  .resultFx span {
    position: absolute; left: 50%; top: 42%;
    width: 6px; height: 10px; border-radius: 1px;
    opacity: 0;
    animation: fxFly 1000ms ease-out forwards;
    animation-delay: var(--delay, 0ms);
  }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cardPop {
    from { transform: scale(.82) translateY(8px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes fxFly {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(.5); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); opacity: 0; }
  }
</style>
</head>
<body>

<script>
(function () {
  // 头像气泡展示时长与截断长度，与音乐房保持一致
  const BUBBLE_MS = 30000
  const BUBBLE_LIMIT = 35

  const inIframe = window.parent !== window
  let ws = null
  let token = ''
  let tokenExpireAt = 0
  let myNick = ''
  let myAvatar = ''
  let myFrameId = 0
  let myFrame = ''
  let snapshot = null
  // 服务端时间 - 本地时间，用于倒计时抵消两端时钟差异
  let clockSkew = 0
  // 上一帧对局阶段，用于识别“刚刚终局”
  let lastPhase = null
  // 上一帧手数：用于识别“有新落子”（只播一手音效，不重复历史）
  let lastMoveCount = -1
  // 聊天室文件服务器地址（铃声等资源），可由外壳 INIT 下发或从头像地址推导
  let fileServerHost = ''
  // 聊天提示音（与音乐房同一音源）
  let ringAudio = null
  let audioUnlocked = false
  // 结果弹窗是否已展示（避免弹窗被后续快照重复触发）
  let resultShown = false
  let reconnectTimer = null
  // 当前鼠标悬停的交叉点，用于半透明落子预览
  let hover = null
  // 象棋：选中的棋子坐标，选中后高亮可走点
  let selected = null
  // 网格交点元素缓存（象棋棋盘带有 SVG 装饰，不能按 childIndex 取点）
  let gridPoints = []
  // 头像气泡：nick -> { text, timer }
  const bubbles = new Map()
  let watcherSig = ''
  // 全屏状态：iframe 内由外壳的 FULLSCREEN_CHANGE 告知，独立标签页由自身 fullscreenchange 跟踪
  let isFullscreen = false

  const grid = document.getElementById('grid')
  const toastEl = document.getElementById('toast')
  const seatEls = {
    1: document.getElementById('seatBlack'),
    2: document.getElementById('seatWhite')
  }

  function toast (msg) {
    toastEl.textContent = msg
    toastEl.classList.add('show')
    clearTimeout(toastEl._t)
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2500)
  }

  // ---------- 获取令牌 ----------

  // 模板A：走 postMessage 向外壳请求令牌
  function requestTokenFromShell () {
    window.parent.postMessage({ type: 'REQUEST_TOKEN' }, '*')
  }

  // 模板B：票据在 URL fragment 中，交给本服务端向聊天室兑换
  async function exchangeTicket () {
    const hash = (location.hash || '').replace(/^#/, '')
    const params = new URLSearchParams(hash)
    const ticket = params.get('ticket')
    if (!ticket) {
      toast('缺少票据，请从房间重新进入')
      return
    }
    // 立即清除 URL 中的票据
    try { history.replaceState(null, '', location.pathname) } catch (e) {}
    try {
      const resp = await fetch('/exchange', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticket })
      })
      if (!resp.ok) {
        toast('票据兑换失败')
        return
      }
      const data = await resp.json()
      onToken(data.token, 0, data.nick)
    } catch (e) {
      toast('票据兑换失败')
    }
  }

  function onToken (value, expireAt, nick) {
    const sameToken = value === token
    token = value
    tokenExpireAt = expireAt || 0
    if (nick) myNick = nick
    // 令牌没变且连接还活着，就不要重连
    if (sameToken && ws && ws.readyState === WebSocket.OPEN) return
    connect()
  }

  // 模板A：接收外壳下发的初始化配置与令牌
  window.addEventListener('message', function (event) {
    const data = event.data || {}
    if (data.type === 'INIT') {
      if (data.config && data.config.roomId) {
        // 房间信息可用于展示，但不能当作可信身份
      }
      // 铃声等资源从聊天室的文件服务器加载（与音乐房同一音源）
      if (data.config) setFileServerHost(data.config.fileServerHost)
    }
    if (data.type === 'TOKEN' && data.token) {
      onToken(data.token, data.expireAt, '')
    }
    // 外壳告知当前全屏状态（含用户按 ESC 退出），用于同步按钮图标
    if (data.type === 'FULLSCREEN_CHANGE') {
      setFullscreenState(!!data.value)
    }
  })

  // 令牌剩余时间不足时先刷新（重连前检查）
  function tokenRemain () {
    if (!tokenExpireAt) return Infinity
    return tokenExpireAt - Math.floor(Date.now() / 1000)
  }

  function reconnect () {
    if (reconnectTimer) return
    const delay = tokenRemain() < 120 ? 3000 : 2000
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null
      if (tokenRemain() < 120) {
        // 需要新令牌：模板A 向外壳请求，模板B 提示重新进入
        if (inIframe) requestTokenFromShell()
        else toast('凭证已过期，请从房间重新进入')
        return
      }
      connect()
    }, delay)
  }

  // ---------- 游戏连接 ----------

  // 关闭旧连接并摘除回调，避免旧连接的回调触发新一轮重连
  function closeSocket () {
    if (!ws) return
    try {
      ws.onopen = null
      ws.onmessage = null
      ws.onclose = null
      ws.onerror = null
      ws.close()
    } catch (e) {}
    ws = null
  }

  function connect () {
    if (!token) return
    // 同一时刻只允许一条连接：先关掉旧的，否则服务端会按"同昵称顶号"互相踢人，
    // 被踢的一方又触发重连，形成 2 秒一次的风暴
    closeSocket()

    setConn('连接中…')
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
    const sock = new WebSocket(proto + '//' + location.host + '/ws?token=' + encodeURIComponent(token))
    ws = sock

    sock.onopen = function () {
      if (ws !== sock) return
      setConn('已连接')
    }
    sock.onmessage = function (event) {
      if (ws !== sock) return
      let msg
      try { msg = JSON.parse(event.data) } catch (e) { return }
      if (msg.type === 'welcome') {
        // 服务端单独告知本连接的身份与展示资料
        myNick = msg.nick || myNick
        myAvatar = msg.avatar || ''
        myFrameId = msg.frameId || 0
        myFrame = msg.frame || ''
        // 重连后不重放历史落子音效：重新以当前手数为基准
        lastMoveCount = -1
        // 重连后不补报历史事件：事件基准待下一次快照重置
        eventBase = false
        if (snapshot) render()
      } else if (msg.type === 'state') {
        snapshot = msg
        syncClock(msg.serverNow)
        render()
        trackNewMoves(msg.game)
      } else if (msg.type === 'chat') {
        addChat(msg.nick, msg.text, msg.avatar, msg.frame, msg.timestamp)
      } else if (msg.type === 'shell_control') {
        // 服务端下发的外壳控制指令（如全屏开关）
        handleShellControl(msg)
      } else if (msg.type === 'error') {
        toast(msg.message || '操作失败')
      }
    }
    sock.onclose = function (event) {
      // 只处理"当前这条连接"的关闭；已被新连接替换的旧连接不再触发重连
      if (ws !== sock) return
      ws = null
      setConn('已断开 code=' + event.code)
      // 4001/4002 等不可重试码不重连
      if ([4001, 4002, 4003, 4005, 4006].includes(event.code)) return
      reconnect()
    }
    sock.onerror = function () {
      if (ws !== sock) return
      setConn('连接异常')
    }
  }

  function setConn (text) {
    document.getElementById('connState').textContent = text
  }

  function send (payload) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      toast('未连接到游戏服务')
      return
    }
    ws.send(JSON.stringify(payload))
  }

  // ---------- 聊天提示音 ----------

  // 与音乐房一致的默认铃声
  const RING_NAME = 'bibi.mp3'

  function setFileServerHost (host) {
    if (!host) return
    fileServerHost = String(host).replace(/\/+$/, '')
  }

  // 头像地址形如 <文件服务器>/avatar/<id>.jpg，可反推文件服务器地址
  function hostFromAvatar (url) {
    if (!url) return ''
    const idx = String(url).indexOf('/avatar/')
    return idx > 0 ? String(url).slice(0, idx) : ''
  }

  function ringSrc () {
    let base = fileServerHost || hostFromAvatar(myAvatar)
    if (!base && snapshot && Array.isArray(snapshot.users)) {
      const withAvatar = snapshot.users.find(u => hostFromAvatar(u.avatar))
      if (withAvatar) base = hostFromAvatar(withAvatar.avatar)
    }
    return base ? base + '/music/' + RING_NAME : ''
  }

  function playRing () {
    const src = ringSrc()
    if (!src) return
    if (!ringAudio) {
      ringAudio = new Audio()
      ringAudio.preload = 'auto'
    }
    if (ringAudio.src !== src) ringAudio.src = src
    try { ringAudio.currentTime = 0 } catch (e) {}
    const task = ringAudio.play()
    // 浏览器自动播放限制导致的失败不打扰用户
    if (task && task.catch) task.catch(() => {})
  }

  // 浏览器要求先有用户交互才允许播放音频：首次交互时静默解锁一次
  function unlockRing () {
    if (audioUnlocked) return
    const src = ringSrc()
    if (!src) return
    if (!ringAudio) {
      ringAudio = new Audio()
      ringAudio.preload = 'auto'
    }
    ringAudio.muted = true
    ringAudio.src = src
    const task = ringAudio.play()
    const done = () => {
      ringAudio.pause()
      ringAudio.currentTime = 0
      ringAudio.muted = false
      audioUnlocked = true
    }
    if (task && task.then) {
      task.then(done).catch(() => { ringAudio.muted = false })
    } else {
      done()
    }
  }

  window.addEventListener('pointerdown', unlockRing)
  window.addEventListener('keydown', unlockRing)

  // ---------- 落子音效 ----------

  // 素材为聊天室文件服务器的绝对地址
  const CHESS_SOUND_URL = 'https://nichijou-1300531302.cos.ap-guangzhou.myqcloud.com/music/chess.mp3'
  // 倒计时提示音：剩余 30 秒播 coach、剩余 10 秒播 warn
  const COACH_URL = 'https://nichijou-1300531302.cos.ap-guangzhou.myqcloud.com/music/coach.mp3'
  const WARN_URL = 'https://nichijou-1300531302.cos.ap-guangzhou.myqcloud.com/music/warn.mp3'
  let coachAudio = null
  let warnAudio = null
  function playCountdownSound (kind) {
    const url = kind === 'coach' ? COACH_URL : WARN_URL
    let audio = kind === 'coach' ? coachAudio : warnAudio
    if (!audio) {
      audio = new Audio(url)
      audio.preload = 'auto'
      if (kind === 'coach') coachAudio = audio
      else warnAudio = audio
    }
    try { audio.currentTime = 0 } catch (e) {}
    const task = audio.play()
    if (task && task.catch) task.catch(() => {})
  }
  // 象棋棋子底图（红/黑两侧），提前预加载避免开局后闪烁
  const XQ_PIECE_IMAGES = [
    'https://nichijou-1300531302.cos.ap-guangzhou.myqcloud.com/game/red3.webp',
    'https://nichijou-1300531302.cos.ap-guangzhou.myqcloud.com/game/black3.webp'
  ]
  XQ_PIECE_IMAGES.forEach(src => { const img = new Image(); img.src = src })
  let chessAudio = null

  function playChess () {
    if (!chessAudio) {
      chessAudio = new Audio(CHESS_SOUND_URL)
      chessAudio.preload = 'auto'
    }
    // 快速连落时从头播
    try { chessAudio.currentTime = 0 } catch (e) {}
    const task = chessAudio.play()
    if (task && task.catch) task.catch(() => {})
  }

  // 检测快照里是否有“新的真实落子”（非停手/非超时），有则响落子音效。
  // 基准手数只在“对局进行中”维护：开局/终局/换局都会重置，避免把历史手重放。
  function trackNewMoves (game) {
    if (!game || game.phase !== 'playing') {
      lastMoveCount = -1
      return
    }
    const moves = game.moves || []
    if (lastMoveCount < 0) {
      lastMoveCount = moves.length
      return
    }
    if (moves.length > lastMoveCount) {
      lastMoveCount = moves.length
      const m = moves[moves.length - 1]
      if (m && !m.pass && !m.timeout) playChess()
    }
  }

  // ---------- 棋局数据 ----------

  // 棋盘尺寸随玩法固定（围棋 19×19 / 五子棋 15×15 / 象棋 9×10），等待阶段也要先画出网格
  const DEFAULT_SIZE = 19
  const MODE_LABELS = { go: '围棋', gomoku: '五子棋', xiangqi: '象棋' }
  // 象棋棋子编码：高 4 位颜色（1=红、2=黑），低 4 位类型
  const XQ_RED_NAMES = '帅仕相马车炮兵'
  const XQ_BLACK_NAMES = '将士象马车炮卒'

  function modeOf (game) {
    return (game && game.mode) || (snapshot && snapshot.mode) || 'go'
  }

  function isXiangqi (game) {
    return modeOf(game) === 'xiangqi'
  }

  function boardDims () {
    const game = snapshot && snapshot.game
    const cols = (snapshot && snapshot.cols) || (game && game.cols) || (snapshot && snapshot.size) || DEFAULT_SIZE
    const rows = (snapshot && snapshot.rows) || (game && game.rows) || (snapshot && snapshot.size) || DEFAULT_SIZE
    return { cols, rows }
  }

  function pieceColor (code) {
    return code >> 4
  }

  function pieceType (code) {
    return code & 0xF
  }

  function pieceName (code) {
    const typ = pieceType(code)
    if (typ < 1 || typ > 7) return ''
    const names = pieceColor(code) === 2 ? XQ_BLACK_NAMES : XQ_RED_NAMES
    return names[typ - 1]
  }

  // 座位/轮次的显示名：象棋红方先手（座位 1），黑方后手（座位 2）
  function sideLabel (color) {
    if (isXiangqi()) return color === 1 ? '红方' : '黑方'
    return color === 1 ? '黑方' : '白方'
  }

  function sideDotClass (color) {
    if (isXiangqi()) return color === 1 ? 'red' : 'black'
    return color === 1 ? 'black' : 'white'
  }

  function seatNick (color) {
    if (!snapshot || !snapshot.seats) return ''
    return (color === 1 ? snapshot.seats.black : snapshot.seats.white) || ''
  }

  function myColor () {
    if (!snapshot || !myNick) return 0
    if (seatNick(1) === myNick) return 1
    if (seatNick(2) === myNick) return 2
    return 0
  }

  function userOf (nick) {
    if (!snapshot || !nick || !snapshot.users) return null
    return snapshot.users.find(u => u.nick === nick) || null
  }

  // 当前局面是否允许我落子（决定是否显示预览、点击是否发落子命令）
  function canPlay () {
    const color = myColor()
    if (!color) return false
    const game = snapshot.game
    if (!game) return true
    if (game.phase !== 'playing') return false
    return game.turn === color
  }

  // ---------- 渲染 ----------

  function render (game) {
    if (!snapshot) return
    game = game || snapshot.game
    normalizeSelection(game)
    renderBoard(game)
    renderSeat(1, game)
    renderSeat(2, game)
    renderWatchers()
    renderTurn(game)
    renderButtons(game)
    renderMode(game)
    renderModeLabel(game)
    syncBubbles()
    watchGamePhase(game)
    trackGameEvents(game)
  }

  // 象棋选中态校验：不是我的回合、棋子已经不在了、或棋子不是我的，则取消选中
  function normalizeSelection (game) {
    if (!selected) return
    if (!isXiangqi(game) || !game || game.phase !== 'playing' || game.turn !== myColor()) {
      selected = null
      return
    }
    const v = ((game.board || [])[selected.y] || [])[selected.x] || 0
    if (!v || pieceColor(v) !== myColor()) selected = null
  }

  // 玩法切换按钮：高亮当前玩法，对局中禁用
  function renderMode (game) {
    const mode = modeOf(game)
    const playing = Boolean(game && game.phase === 'playing')
    document.querySelectorAll('.modeBtn').forEach(btn => {
      btn.classList.toggle('isActive', btn.dataset.mode === mode)
      btn.disabled = playing
    })
  }

  // 棋盘上方标注当前玩法（显眼但自然）
  function renderModeLabel (game) {
    const el = document.getElementById('modeLabel')
    if (!el) return
    el.textContent = MODE_LABELS[modeOf(game)] || '围棋'
  }

  // 记录时钟偏差：后续倒计时统一用 本地时间 + 偏差 得到服务端时间
  function syncClock (serverNow) {
    if (typeof serverNow === 'number' && serverNow > 0) {
      clockSkew = serverNow - Date.now()
    }
  }

  // 对局从 playing 变为 ended 时弹出结果特效
  function watchGamePhase (game) {
    const phase = game ? game.phase : 'waiting'
    if (phase === 'ended') {
      if (lastPhase === 'playing' && !resultShown) showResult(game)
    } else {
      // 新一局或回到等待态：收起弹窗并允许下次重新触发
      if (phase === 'playing') resultShown = false
      hideResult()
    }
    lastPhase = phase
  }

  // 星位（标准棋盘）：19 路 9 个点，13 路与 9 路取各自的常用布局
  const STAR_POINTS = {
    19: [[3, 3], [3, 9], [3, 15], [9, 3], [9, 9], [9, 15], [15, 3], [15, 9], [15, 15]],
    15: [[3, 3], [3, 7], [3, 11], [7, 3], [7, 7], [7, 11], [11, 3], [11, 7], [11, 11]],
    13: [[3, 3], [3, 9], [9, 3], [9, 9], [6, 6]],
    9: [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]]
  }

  function renderBoard (game) {
    const { cols, rows } = boardDims()
    // 象棋未开局时用服务端下发的开局摆法预览，其余玩法空棋盘
    const board = (game && game.board) || (snapshot && snapshot.preview && snapshot.preview.board) || []
    const xq = isXiangqi(game)

    grid.style.setProperty('--cols', cols)
    grid.style.setProperty('--rows', rows)
    grid.classList.toggle('isXq', xq)
    grid.parentElement.classList.toggle('isXq', xq)

    const sig = cols + 'x' + rows + (xq ? '-xq' : '')
    if (grid.dataset.sig !== sig) {
      grid.dataset.sig = sig
      grid.innerHTML = ''
      gridPoints = []
      if (xq) grid.appendChild(buildXiangqiArt(cols, rows))
      const stars = xq ? new Set() : new Set((STAR_POINTS[cols] || []).map(([x, y]) => `${x},${y}`))
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const p = document.createElement('div')
          p.className = 'point'
          p.dataset.x = x
          p.dataset.y = y
          // 最外一圈用于把边线画得加粗且平整（不超出交点）
          if (x === 0) p.classList.add('edgeL')
          if (x === cols - 1) p.classList.add('edgeR')
          if (y === 0) p.classList.add('edgeT')
          if (y === rows - 1) p.classList.add('edgeB')
          // 象棋：河界处的竖线断开（最左/最右两路保持贯通）
          if (xq && x > 0 && x < cols - 1) {
            if (y === 4) p.classList.add('riverAbove')
            if (y === 5) p.classList.add('riverBelow')
          }
          if (stars.has(`${x},${y}`)) {
            const dot = document.createElement('div')
            dot.className = 'starDot'
            p.appendChild(dot)
          }
          p.addEventListener('click', () => onPointClick(x, y))
          gridPoints.push(p)
          grid.appendChild(p)
        }
      }
      syncGridMetrics()
    }

    const moves = game && game.moves ? game.moves : []
    const last = moves.length ? moves[moves.length - 1] : null
    // 象棋视角：我是黑方时棋盘上下翻转（黑方在下、红方在上）；红方与观战者用红方视角
    const flipped = isXiangqi(game) && myColor() === 2
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const p = gridPoints[y * cols + x]
        if (!p) continue
        const by = flipped ? rows - 1 - y : y
        const v = (board[by] && board[by][x]) || 0
        const stone = p.querySelector('.stone:not(.previewStone)')
        const pieceEl = p.querySelector('.piece')
        if (v === 0) {
          if (stone) stone.remove()
          if (pieceEl) pieceEl.remove()
        } else if (xq) {
          if (stone) stone.remove()
          const cls = 'piece ' + (pieceColor(v) === 2 ? 'black' : 'red')
          const el = pieceEl || document.createElement('div')
          el.className = cls
          // 文字包进 span，方便做光学居中（相对字号上移 1/5，见 .piece > span）
          let span = el.querySelector('span')
          if (!span) {
            span = document.createElement('span')
            el.appendChild(span)
          }
          span.textContent = pieceName(v)
          if (!pieceEl) p.appendChild(el)
        } else {
          if (pieceEl) pieceEl.remove()
          const cls = v === 1 ? 'stone black' : 'stone white'
          if (!stone || stone.className !== cls) {
            if (stone) stone.remove()
            const el = document.createElement('div')
            el.className = cls
            p.appendChild(el)
          }
        }
        if (!xq) {
          const isLast = last && !last.pass && last.x === x && last.y === y
          p.classList.toggle('last', !!isLast)
        }
      }
    }

    if (xq) renderXiangqiMarks(game, cols, rows)
    grid.classList.toggle('canPlay', canPlay())
    updatePreview()
  }

  // 象棋棋盘装饰：九宫斜线、炮/兵位标记、楚河汉界
  function buildXiangqiArt (cols, rows) {
    const NS = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(NS, 'svg')
    svg.setAttribute('class', 'boardArt')
    svg.setAttribute('viewBox', `0 0 ${cols} ${rows}`)
    svg.setAttribute('aria-hidden', 'true')
    // 交点在第 i 列的中心，即 i + 0.5
    const cx = i => i + 0.5
    const cy = j => j + 0.5
    const line = (x1, y1, x2, y2) => {
      const el = document.createElementNS(NS, 'line')
      el.setAttribute('x1', x1)
      el.setAttribute('y1', y1)
      el.setAttribute('x2', x2)
      el.setAttribute('y2', y2)
      svg.appendChild(el)
    }
    // 九宫斜线
    line(cx(3), cy(0), cx(5), cy(2))
    line(cx(5), cy(0), cx(3), cy(2))
    line(cx(3), cy(7), cx(5), cy(9))
    line(cx(5), cy(7), cx(3), cy(9))
    // 炮位与兵卒位的十字标记（贴边的点只画内侧）
    const MARK_POINTS = [
      [1, 2], [7, 2], [1, 7], [7, 7],
      [0, 3], [2, 3], [4, 3], [6, 3], [8, 3],
      [0, 6], [2, 6], [4, 6], [6, 6], [8, 6]
    ]
    const gap = 0.09
    const len = 0.16
    MARK_POINTS.forEach(([mx, my]) => {
      if (mx >= cols || my >= rows) return
      const px = cx(mx)
      const py = cy(my)
      ;[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
        if ((sx < 0 && mx === 0) || (sx > 0 && mx === cols - 1)) return
        // 角点指向交叉点，两条腿分别向外延伸（水平/竖直）
        const nx = px + sx * gap
        const ny = py + sy * gap
        line(nx, ny, px + sx * (gap + len), ny)
        line(nx, ny, nx, py + sy * (gap + len))
      })
    })
    // 楚河汉界：默认位于河界中线略下方，再往下移 4 设计像素（按每格像素换算 viewBox 单位）
    const cellPx = grid.offsetWidth / cols
    const textDy = cellPx > 0 ? 4 / cellPx : 0.065
    ;[['楚 河', 2], ['漢 界', 6]].forEach(([text, col]) => {
      const el = document.createElementNS(NS, 'text')
      el.setAttribute('x', cx(col))
      el.setAttribute('y', 5.08 + textDy)
      el.setAttribute('font-size', 0.62)
      el.setAttribute('text-anchor', 'middle')
      el.textContent = text
      svg.appendChild(el)
    })
    return svg
  }

  // 象棋标记：上一步移动的棋子发光、选中棋子、可走点、被将军的将帅。
  // 内部坐标一律为棋盘坐标；渲染时按视角翻转（黑方在下）。
  function renderXiangqiMarks (game, cols, rows) {
    gridPoints.forEach(p => {
      p.classList.remove('selected', 'target', 'hasPiece', 'inCheck', 'lastMove')
      p.querySelectorAll('.moveTip').forEach(el => el.remove())
    })
    if (!game) return

    const board = game.board || []
    const flipped = isXiangqi() && myColor() === 2
    const vy = y => (flipped ? rows - 1 - y : y)
    const at = (x, y) => ((board[y] || [])[x] || 0)
    const pointAt = (x, y) => gridPoints[vy(y) * cols + x]

    // 上一步移动的棋子：给终点棋子加发光效果
    const moves = game.moves || []
    const last = moves.length ? moves[moves.length - 1] : null
    if (last && !last.pass) {
      const p = pointAt(last.x, last.y)
      if (p) p.classList.add('lastMove')
    }

    // 选中棋子 + 可走点（selected 与 legalMoves 均为棋盘坐标）
    if (selected && canPlay()) {
      const selPoint = gridPoints[vy(selected.y) * cols + selected.x]
      if (selPoint) selPoint.classList.add('selected')
      ;(game.legalMoves || []).forEach(m => {
        if (m.fromX !== selected.x || m.fromY !== selected.y) return
        const p = gridPoints[vy(m.toY) * cols + m.toX]
        if (!p) return
        p.classList.add('target')
        if (at(m.toX, m.toY)) p.classList.add('hasPiece')
        const tip = document.createElement('div')
        tip.className = 'moveTip'
        p.appendChild(tip)
      })
    }

    // 被将军的一方：给将帅加红光（game.check 表示「轮到的一方被将军」）
    if (game.phase === 'playing' && game.check) {
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const v = at(x, y)
          if (!v) continue
          if (pieceType(v) !== 1 || pieceColor(v) !== game.turn) continue
          const p = pointAt(x, y)
          if (p) p.classList.add('inCheck')
        }
      }
    }
  }

  // 把格子边长写进 CSS 变量，象棋棋子字号按格子大小缩放
  function syncGridMetrics () {
    const { cols } = boardDims()
    const w = grid.offsetWidth
    if (w && cols) grid.style.setProperty('--cell', (w / cols) + 'px')
  }

  // 半透明落子预览：停在空交叉点时显示己方棋子轮廓（象棋改用选中高亮，不显示预览）
  function updatePreview () {
    grid.querySelectorAll('.previewStone').forEach(el => el.remove())
    if (isXiangqi() || !hover || !snapshot || !canPlay()) return
    const { cols, rows } = boardDims()
    const game = snapshot.game
    const board = (game && game.board) || []
    if (!gridPoints.length) return
    const row = board[hover.y]
    if (row && row[hover.x]) return
    if (hover.x >= cols || hover.y >= rows) return
    const point = gridPoints[hover.y * cols + hover.x]
    if (!point) return
    const stone = document.createElement('div')
    stone.className = 'stone previewStone ' + (myColor() === 1 ? 'black' : 'white')
    point.appendChild(stone)
  }

  // 头像框地址：优先用令牌里的 frame URL；只给了 frameId 时从头像地址推导同一文件服务器
  function frameSrc (avatar, frame, frameId) {
    if (frame) return frame
    if (frameId > 0 && avatar) {
      return avatar.replace(/\/avatar\/[^/]+$/, `/frame/${frameId}.webp`)
    }
    return ''
  }

  // 单个座位：空位 -> 加号占位；有人 -> 头像 + 头像框
  function renderSeat (color, game) {
    const slot = seatEls[color]
    if (!slot) return
    const nick = seatNick(color)
    const info = userOf(nick)
    const isMe = Boolean(nick) && nick === myNick
    const avatarUrl = (info && info.avatar) || (isMe ? myAvatar : '')
    const frameUrl = info
      ? frameSrc(info.avatar, info.frame, info.frameId)
      : (isMe ? frameSrc(myAvatar, myFrame, myFrameId) : '')

    const avatarImg = slot.querySelector('.avatarImg')
    const frameImg = slot.querySelector('.frameImg')
    const fallback = slot.querySelector('.avatarFallback')
    const nameEl = slot.querySelector('.seatName')

    if (avatarUrl) {
      if (avatarImg.getAttribute('src') !== avatarUrl) avatarImg.setAttribute('src', avatarUrl)
      avatarImg.hidden = false
      fallback.hidden = true
    } else {
      avatarImg.hidden = true
      avatarImg.removeAttribute('src')
      fallback.hidden = false
      fallback.textContent = nick ? nick.slice(0, 1) : '+'
    }
    if (frameUrl) {
      if (frameImg.getAttribute('src') !== frameUrl) frameImg.setAttribute('src', frameUrl)
      frameImg.hidden = false
    } else {
      frameImg.hidden = true
      frameImg.removeAttribute('src')
    }

    nameEl.textContent = nick ? (isMe ? `${nick}（你）` : nick) : '空位 · 点击上座'
    slot.dataset.bubble = nick
    slot.classList.toggle('isOccupied', Boolean(nick))
    slot.title = nick ? (isMe ? '点击离座' : `${nick} 已就座`) : `点击坐在${sideLabel(color)}`
    // 座位颜色标记：象棋座位 1 为红方、座位 2 为黑方
    const badge = slot.querySelector('.seatColorBadge')
    if (badge) {
      badge.className = 'seatColorBadge ' + sideDotClass(color)
      badge.title = sideLabel(color)
    }

    // 准备状态
    const readyEl = document.getElementById(color === 1 ? 'readyBlack' : 'readyWhite')
    if (readyEl) {
      const isReady = snapshot && snapshot.ready && snapshot.ready[color === 1 ? 'black' : 'white']
      readyEl.textContent = isReady ? '已准备' : ''
    }

    // 已悔棋次数：有次数才展示（头像下方）
    const undoEl = document.getElementById(color === 1 ? 'undoBlack' : 'undoWhite')
    if (undoEl) {
      const used = snapshot && snapshot.game && snapshot.game.undoUsed
        ? (snapshot.game.undoUsed[color === 1 ? 'black' : 'white'] || 0)
        : 0
      // 固定高度状态行：没次数时清空文案即可，不切换 hidden，避免容器高度变化
      undoEl.textContent = used ? `已悔棋${used}次` : ''
    }

    const playing = Boolean(game && game.phase === 'playing')
    const isTurn = playing && Boolean(nick) && game.turn === color
    slot.classList.toggle('isTurn', isTurn)
    slot.classList.toggle('isOther', playing && Boolean(nick) && !isTurn)
  }

  // 观战成员：座位之外的连接用户，带头像与头像框
  function renderWatchers () {
    const box = document.getElementById('watchers')
    const emptyEl = document.getElementById('watchersEmpty')
    const users = (snapshot && snapshot.users) || []
    const watchers = users.filter(u => u.nick !== seatNick(1) && u.nick !== seatNick(2))
    const sig = watchers.map(u => `${u.nick}:${u.avatar || ''}:${u.frameId || 0}:${u.frame || ''}`).join('|')

    if (sig !== watcherSig) {
      watcherSig = sig
      box.innerHTML = ''
      watchers.forEach(user => {
        const item = document.createElement('div')
        item.className = 'watcher'
        item.dataset.bubble = user.nick
        item.title = user.nick

        const bubble = document.createElement('div')
        bubble.className = 'bubble'

        const host = document.createElement('div')
        host.className = 'avatarHost'
        host.appendChild(bubble)

        const wrap = document.createElement('div')
        wrap.className = 'avatarWrap'
        if (user.avatar) {
          const img = document.createElement('img')
          img.className = 'avatarImg'
          img.alt = ''
          img.src = user.avatar
          wrap.appendChild(img)
        } else {
          const fb = document.createElement('div')
          fb.className = 'avatarFallback'
          fb.textContent = user.nick.slice(0, 1)
          wrap.appendChild(fb)
        }
        if (user.frame || (user.frameId > 0 && user.avatar)) {
          const frame = document.createElement('img')
          frame.className = 'frameImg'
          frame.alt = ''
          frame.src = frameSrc(user.avatar, user.frame, user.frameId)
          wrap.appendChild(frame)
        }
        host.appendChild(wrap)

        const nameEl = document.createElement('div')
        nameEl.className = 'watcherNick'
        nameEl.textContent = user.nick

        item.appendChild(host)
        item.appendChild(nameEl)
        box.appendChild(item)
      })
    }

    emptyEl.hidden = watchers.length > 0
  }

  function renderTurn (game) {
    const turnEl = document.getElementById('turn')
    const myTurnEl = document.getElementById('myTurn')
    const resultEl = document.getElementById('result')
    const mySeatColor = myColor()

    let showMyTurn = false
    let inCheck = false
    if (game) {
      if (game.phase === 'playing') {
        const nick = game.turn === 1 ? game.black : game.white
        turnEl.innerHTML = '轮到 <span class="dot ' + sideDotClass(game.turn) + '"></span> ' +
          sideLabel(game.turn) + (nick ? ' · ' + escapeHtml(nick) : '')
        showMyTurn = mySeatColor === game.turn
        inCheck = Boolean(game.check)
      } else if (game.phase === 'ended') {
        turnEl.textContent = '对局结束'
      } else {
        turnEl.textContent = '等待开始'
      }
      resultEl.textContent = game.result || ''
    } else {
      const black = seatNick(1)
      const white = seatNick(2)
      if (black && white) turnEl.textContent = '双方就座，等待开始'
      else if (black || white) turnEl.textContent = '等待另一位棋手就座'
      else turnEl.textContent = '点击座位加入对局'
      resultEl.textContent = ''
    }
    myTurnEl.hidden = !showMyTurn
    const checkEl = document.getElementById('checkFlag')
    if (checkEl) checkEl.hidden = !inCheck
  }

  function escapeHtml (text) {
    return String(text).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]))
  }

  function renderButtons (game) {
    const seated = myColor() !== 0
    const bothSeated = Boolean(seatNick(1) && seatNick(2))
    const playing = Boolean(game && game.phase === 'playing')
    const startBtn = document.getElementById('btnStart')
    // 准备流程：双方都准备后自动开局；已准备再点一次取消
    const myColorNum = myColor()
    const myReady = myColorNum && snapshot && snapshot.ready
      ? snapshot.ready[myColorNum === 1 ? 'black' : 'white']
      : false
    startBtn.textContent = myReady ? '取消准备' : '准备'
    startBtn.disabled = !seated || playing
    document.getElementById('btnLeaveSeat').disabled = !seated
    // 象棋没有停一手
    const passBtn = document.getElementById('btnPass')
    passBtn.hidden = isXiangqi(game)
    passBtn.disabled = !(playing && seated)
    document.getElementById('btnResign').disabled = !(playing && seated)

    // 悔棋：对局中、自己是棋手、最后一手是自己下的（对手未落子）、且未超过次数上限
    const undoBtn = document.getElementById('btnUndo')
    if (undoBtn) {
      const myColorNum2 = myColor()
      const moves = (game && game.moves) || []
      const last = moves.length ? moves[moves.length - 1] : null
      const used = game && game.undoUsed
        ? (game.undoUsed[myColorNum2 === 1 ? 'black' : 'white'] || 0)
        : 0
      const maxUndo = (snapshot && snapshot.game && snapshot.game.maxUndo) || 3
      const lastIsMine = Boolean(last) && !last.pass && myColorNum2 && last.color === myColorNum2
      undoBtn.disabled = !(playing && seated && lastIsMine && used < maxUndo)
      const left = Math.max(0, maxUndo - used)
      undoBtn.textContent = '悔棋'
      undoBtn.title = left > 0 ? `回退自己最后一手（本局还剩 ${left} 次）` : '本局悔棋次数已用完'
    }
  }

  // ---------- 回合倒计时 ----------

  function formatClock (seconds) {
    const m = Math.floor(seconds / 60)
    const s = seconds % 60
    return m + ':' + String(s).padStart(2, '0')
  }

  // 倒计时以服务端 turnDeadline 为准，本地只负责每秒重绘。
  // 位置：当前该出棋一方的座位头像上方（黑座 clockBlack / 白座 clockWhite）
  // 提示音：每回合在剩余时间跨过 30 秒/10 秒阈值时各播一次（coach/warn）
  let countdownKey = ''
  let lastCountdownRemain = Infinity
  function tickCountdown () {
    const game = snapshot && snapshot.game
    const activeTurn = game && game.phase === 'playing' ? game.turn : 0
    let remainNow = Infinity
    for (const color of [1, 2]) {
      const el = document.getElementById(color === 1 ? 'clockBlack' : 'clockWhite')
      if (!el) continue
      const show = activeTurn === color && game.turnDeadline > 0
      el.hidden = !show
      if (!show) continue
      const remainMs = game.turnDeadline - (Date.now() + clockSkew)
      const remain = Math.max(0, Math.ceil(remainMs / 1000))
      el.textContent = '剩余 ' + formatClock(remain)
      el.classList.toggle('isUrgent', remain <= 10)
      if (remainNow === Infinity || remain < remainNow) remainNow = remain
    }

    if (remainNow !== Infinity) {
      const key = activeTurn + ':' + (game.turnDeadline || 0)
      if (key !== countdownKey) {
        // 新回合/开局：只设基准，避免回合本身不足 30 秒时开局误响提示音
        countdownKey = key
        lastCountdownRemain = remainNow
      } else {
        if (remainNow <= 30 && lastCountdownRemain > 30) playCountdownSound('coach')
        if (remainNow <= 10 && lastCountdownRemain > 10) playCountdownSound('warn')
        lastCountdownRemain = remainNow
      }
    } else {
      // 对局结束/回合切换瞬间：重置，下一回合重新从基准开始
      countdownKey = ''
      lastCountdownRemain = Infinity
    }
  }

  // 本局用时：对局中以 startedAt 实时走秒；结束后以 endedAt 截止固定，不再增长
  function tickGameTime () {
    const el = document.getElementById('gameTime')
    const game = snapshot && snapshot.game
    if (!game || !game.startedAt) {
      el.hidden = true
      el.textContent = ''
      return
    }
    const endRef = game.phase === 'ended' && game.endedAt > 0 ? game.endedAt : (Date.now() + clockSkew)
    const elapsed = Math.max(0, Math.floor((endRef - game.startedAt) / 1000))
    el.hidden = false
    el.textContent = '本局用时 ' + formatClock(elapsed)
  }

  // ---------- 终局结果特效 ----------

  const FX_COLORS = ['#ffd479', '#ff7a7a', '#7ad3ff', '#9bf6c3', '#c9a7ff']

  function showResult (game) {
    const overlay = document.getElementById('resultOverlay')
    const headline = document.getElementById('resultHeadline')
    const detail = document.getElementById('resultDetail')
    const fx = document.getElementById('resultFx')
    const mySeatColor = myColor()
    // 只有本局棋手（黑/白座位上的玩家）能看到操作按钮，观战者只留“关闭”
    const isPlayer = Boolean(game) && myNick && (myNick === game.black || myNick === game.white)
    const resetBtn = document.getElementById('btnResetGame')
    if (resetBtn) resetBtn.hidden = !isPlayer

    let text = '平局'
    let cls = 'isDraw'
    if (game.abandoned) {
      // 棋手离房导致作废：没有胜方，不能显示成平局
      text = '对局中止'
      cls = 'isLose'
    } else if (game.winner) {
      if (game.winner === myNick) {
        text = '你赢了！'
        cls = 'isWin'
      } else if (mySeatColor) {
        text = '你输了'
        cls = 'isLose'
      } else {
        text = `${game.winner} 获胜`
        cls = 'isWin'
      }
    }
    headline.textContent = text
    headline.className = 'resultHeadline ' + cls

    const lines = []
    if (game.result) lines.push(escapeHtml(game.result))
    if (game.black || game.white) {
      lines.push(`${sideLabel(1)} ${escapeHtml(game.black || '—')} · ${sideLabel(2)} ${escapeHtml(game.white || '—')}`)
    }
    detail.innerHTML = lines.join('<br>')

    // 彩带特效：每次随机方向飞散
    fx.innerHTML = ''
    for (let i = 0; i < 24; i++) {
      const piece = document.createElement('span')
      const angle = Math.random() * Math.PI * 2
      const radius = 70 + Math.random() * 90
      piece.style.background = FX_COLORS[i % FX_COLORS.length]
      piece.style.setProperty('--dx', Math.cos(angle) * radius + 'px')
      piece.style.setProperty('--dy', Math.sin(angle) * radius + 'px')
      piece.style.setProperty('--rot', Math.round(Math.random() * 720 - 360) + 'deg')
      piece.style.setProperty('--delay', Math.round(Math.random() * 180) + 'ms')
      fx.appendChild(piece)
    }

    overlay.hidden = false
    resultShown = true
  }

  function hideResult () {
    const overlay = document.getElementById('resultOverlay')
    if (overlay && !overlay.hidden) overlay.hidden = true
  }

  // ---------- 头像气泡 ----------

  function showBubble (nick, text) {
    if (!nick || !text) return
    const fixed = text.length > BUBBLE_LIMIT ? text.slice(0, BUBBLE_LIMIT) + '...' : text
    // 表情指令渲染成图片，其余文本转义（复用聊天区渲染逻辑，气泡不带昵称前缀）
    const html = renderChatBody('', fixed)
    const prev = bubbles.get(nick)
    if (prev && prev.timer) clearTimeout(prev.timer)
    const timer = setTimeout(() => {
      bubbles.delete(nick)
      syncBubbles()
    }, BUBBLE_MS)
    bubbles.set(nick, { text: fixed, html, timer })
    syncBubbles()
  }

  // 把气泡内容写回所有头像节点（座位与观战成员）
  function syncBubbles () {
    document.querySelectorAll('[data-bubble]').forEach(el => {
      const nick = el.dataset.bubble
      const item = nick ? bubbles.get(nick) : null
      const bubbleEl = el.classList.contains('bubble') ? el : el.querySelector('.bubble')
      if (!bubbleEl) return
      const textEl = bubbleEl.querySelector('.bubbleText')
      if (!textEl) return
      const html = item ? item.html : ''
      if (textEl.innerHTML !== html) textEl.innerHTML = html
      bubbleEl.classList.toggle('show', Boolean(html))
    })
  }

  // 游戏内聊天的内置表情：指令完全匹配时渲染为图片（与聊天室行为一致）
  const EMOTICON_BASE = 'https://nichijou-1300531302.cos.ap-guangzhou.myqcloud.com/emoticon/'
  const IN_GAME_EMOTIONS = [
    { keys: ['/坏笑', '/淳朴'], name: 'badgrin.gif', width: '2em', height: '2em' },
    { keys: ['/猪头', '/笨', '/猪'], name: 'pig.gif', width: '1.5em', height: '1.5em' },
    { keys: ['/不幸', '/衰'], name: 'badluck.gif', width: '1.5em', height: '1.5em' },
    { keys: ['/怒', '/锤'], name: 'nu.gif', height: '5em' },
    { keys: ['/吸烟'], name: 'smok.gif', width: '1.5em', height: '1.5em' }
  ]

  // 渲染聊天正文：整条消息命中表情指令则输出图片，否则纯文本（已转义防 XSS）
  function renderChatBody (nick, text) {
    const emo = IN_GAME_EMOTIONS.find(e => e.keys.includes(text.trim()))
    if (emo) {
      const wh = []
      if (emo.width) wh.push('width:' + emo.width)
      if (emo.height) wh.push('height:' + emo.height)
      return escapeHtml(nick ? nick + ': ' : '') +
        `<img src="${EMOTICON_BASE}${emo.name}" style="${wh.join(';')};vertical-align:middle" alt="" loading="lazy">`
    }
    return escapeHtml((nick ? nick + ': ' : '') + text)
  }

  function addChat (nick, text, avatar, frame, timestamp) {
    const log = document.getElementById('chatLog')
    const row = document.createElement('div')
    row.className = 'chatRow'
    const timeEl = document.createElement('span')
    timeEl.className = 'chatTime'
    timeEl.textContent = formatChatTime(timestamp)
    const bodyEl = document.createElement('span')
    bodyEl.innerHTML = renderChatBody(nick, text)
    row.appendChild(timeEl)
    row.appendChild(bodyEl)
    log.appendChild(row)
    log.scrollTop = log.scrollHeight
    // 消息到达即响铃（与音乐房一致，自己发的也会响）
    playRing()
    // 头像资料以房间快照为准，快照缺失时用消息自带的资料兜底；
    // 游客消息没有头像资料也要加入观战列表，否则气泡没有可挂载的头像节点
    if (nick && !userOf(nick)) {
      if (!snapshot) return
      snapshot.users = (snapshot.users || []).concat([{ nick, avatar, frame, state: 'spectating' }])
      render()
    }
    showBubble(nick, text)
  }

  // 游戏事件（对局开始/吃子/结束）写入游戏内聊天区，金色系统行
  function addEvent (text) {
    const log = document.getElementById('chatLog')
    const row = document.createElement('div')
    row.className = 'chatRow eventRow'
    const timeEl = document.createElement('span')
    timeEl.className = 'chatTime'
    timeEl.textContent = formatChatTime(Math.floor(Date.now() / 1000))
    const bodyEl = document.createElement('span')
    bodyEl.textContent = text
    row.appendChild(timeEl)
    row.appendChild(bodyEl)
    log.appendChild(row)
    log.scrollTop = log.scrollHeight
  }

  // 事件基准：首次快照（含重连/换局）只设基准，不补报历史事件
  let eventBase = false
  let eventPhase = 'waiting'
  let eventMoveCount = -1
  function trackGameEvents (game) {
    if (!game) {
      // 无对局（等待/已重置/换玩法）：记住状态，开局时才能上报开始事件
      eventBase = true
      eventPhase = 'waiting'
      eventMoveCount = -1
      return
    }
    const phase = game.phase
    const moves = game.moves || []
    const mc = moves.length
    if (!eventBase) {
      // 重连/中途加入：只设基准，不补报历史事件
      eventBase = true
      eventPhase = phase
      eventMoveCount = phase === 'playing' ? mc : -1
      return
    }
    const xq = isXiangqi(game)
    // 对局开始
    if (phase === 'playing' && eventPhase !== 'playing') {
      addEvent(`对局开始：${sideLabel(1)} ${game.black || '—'} vs ${sideLabel(2)} ${game.white || '—'}`)
      eventMoveCount = mc
    } else if (phase === 'playing' && mc > eventMoveCount && eventMoveCount >= 0) {
      // 新走子：吃子/提子事件
      const m = moves[mc - 1]
      if (m && !m.pass) {
        if (xq && m.taken) {
          addEvent(`${m.nick} 吃掉${pieceName(m.taken)}`)
        } else if (!xq && m.captured > 0) {
          addEvent(`${m.nick} 提子 ${m.captured} 枚`)
        }
      }
      eventMoveCount = mc
    }
    // 对局结束（含认输/将死/超时/离座中止）
    if (phase === 'ended' && eventPhase === 'playing' && game.result) {
      addEvent(`对局结束：${game.result}`)
    }
    eventPhase = phase
    if (phase !== 'playing') eventMoveCount = -1
  }

  function formatChatTime (timestamp) {
    const date = timestamp > 0 ? new Date(timestamp * 1000) : new Date()
    return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`
  }

  // ---------- 交互 ----------

  function onPointClick (x, y) {
    if (!snapshot) return
    if (!canPlay()) {
      if (!myColor()) {
        // 观战者点击棋盘：象棋提示棋盘状态，其余玩法静默忽略
        return
      }
      toast(snapshot.game ? '还没轮到你落子' : '对局尚未开始')
      return
    }
    if (isXiangqi()) {
      handleXiangqiClick(x, y)
      return
    }
    send({ type: 'place', x, y })
  }

  // 象棋：先点己方棋子选中，再点高亮点走子；点其它地方取消选中。
  // 点击坐标为显示坐标，黑方视角下棋盘上下翻转，先换算成棋盘坐标再处理。
  function handleXiangqiClick (x, y) {
    const game = snapshot && snapshot.game
    if (!game) return
    const { rows } = boardDims()
    const ry = (isXiangqi() && myColor() === 2) ? rows - 1 - y : y
    const board = game.board || []
    const v = (board[ry] && board[ry][x]) || 0
    const mine = pieceColor(v) === myColor()

    if (selected) {
      const target = (game.legalMoves || []).some(m =>
        m.fromX === selected.x && m.fromY === selected.y && m.toX === x && m.toY === ry)
      if (target) {
        const from = selected
        selected = null
        send({ type: 'move', fromX: from.x, fromY: from.y, x, y: ry })
        return
      }
      if (mine) {
        selected = { x, y: ry }
        render()
        return
      }
      if (v) {
        // 点到对方棋子：不是可吃子，提示并取消选中
        toast('这不是可走的着法')
        selected = null
        render()
        return
      }
      selected = null
      render()
      return
    }

    if (mine) {
      selected = { x, y: ry }
      render()
    } else if (v) {
      toast('不能动对方的棋子')
    }
  }

  // 用 Pointer Events 计算交叉点（鼠标 / 触摸 / 手写笔通用）：
  // 移动/按下时显示预览，抬起/离开时隐藏；快速划过也不会漏掉。
  function updatePointerHover (event) {
    const { cols, rows } = boardDims()
    const rect = grid.getBoundingClientRect()
    const cellW = rect.width / cols
    const cellH = rect.height / rows
    if (!cellW || !cellH) return
    const x = Math.floor((event.clientX - rect.left) / cellW)
    const y = Math.floor((event.clientY - rect.top) / cellH)
    if (x < 0 || y < 0 || x >= cols || y >= rows) {
      setHover(null)
      return
    }
    if (!hover || hover.x !== x || hover.y !== y) setHover({ x, y })
  }

  grid.addEventListener('pointermove', updatePointerHover)
  // 触屏按下即预览（手指未抬起也能看到落点）
  grid.addEventListener('pointerdown', updatePointerHover)
  grid.addEventListener('pointerup', () => setHover(null))
  grid.addEventListener('pointercancel', () => setHover(null))
  grid.addEventListener('pointerleave', () => setHover(null))

  function setHover (next) {
    hover = next
    updatePreview()
  }

  function onSeatClick (color) {
    if (!snapshot) return
    const nick = seatNick(color)
    if (nick === myNick) {
      send({ type: 'leave_seat' })
      return
    }
    if (nick) {
      toast(`该座位已被 ${nick} 占用`)
      return
    }
    send({ type: 'sit', color })
  }

  document.querySelectorAll('.modeBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!snapshot) return
      if (snapshot.game && snapshot.game.phase === 'playing') {
        toast('对局进行中，不能切换玩法')
        return
      }
      if (btn.dataset.mode === snapshot.mode) return
      send({ type: 'set_mode', mode: btn.dataset.mode })
    })
  })

  seatEls[1].addEventListener('click', () => onSeatClick(1))
  seatEls[2].addEventListener('click', () => onSeatClick(2))

  // ---------- 等比缩放 ----------

  // 设计画布固定为 1024x768（4:3，与外壳 canvasRatio 一致），
  // 视口任意大小都整体按比例缩放，内容展示比例保持不变。
  // 横屏用 4:3 画布，竖屏用 9:16 画布；由外壳决定 iframe 比例，页面按视口自适应
  const LANDSCAPE_W = 1024
  const LANDSCAPE_H = 768
  const PORTRAIT_W = 540
  const PORTRAIT_H = 960
  // 竖屏画布最矮高度：只需保证顶部栏 + 一块能看见的棋盘，
  // 更矮的区域（如 3:4）由 layout 纵向滚动兜底。
  const PORTRAIT_MIN_H = 560
  const pageEl = document.getElementById('page')

  function fitPage () {
    if (!pageEl) return
    // 视口高大于宽（比例 < 0.9）视为竖屏
    const portrait = innerWidth / innerHeight < 0.9
    const w = portrait ? PORTRAIT_W : LANDSCAPE_W
    // 竖屏时高度跟随实际视口比例：外壳给的是 3:4 / 9:16 / 铺满都能正好铺满，
    // 这样页面宽度撑满 iframe，棋盘也就能按最大宽度渲染。
    const h = portrait
      ? Math.max(PORTRAIT_MIN_H, Math.round(w * innerHeight / Math.max(innerWidth, 1)))
      : LANDSCAPE_H
    pageEl.classList.toggle('is-portrait', portrait)
    pageEl.style.width = w + 'px'
    pageEl.style.height = h + 'px'
    const scale = Math.min(innerWidth / w, innerHeight / h)
    pageEl.style.transform = 'translate(-50%, -50%) scale(' + scale + ')'
    // 横竖屏切换后棋盘尺寸会变（象棋棋子字号按格子大小缩放）
    syncGridMetrics()
  }

  window.addEventListener('resize', fitPage)
  fitPage()

  // ---------- 全屏 ----------

  const fullscreenBtn = document.getElementById('fullscreenBtn')

  // 点击图标：把目标状态发给游戏服务端，由服务端回发 shell_control 指挥外壳全屏。
  // 走服务端是让玩法服务端掌握外壳控制权（协议能力），图标这里只是触发入口。
  fullscreenBtn.addEventListener('click', () => {
    const next = !isFullscreen
    if (ws && ws.readyState === WebSocket.OPEN) {
      send({ type: 'fullscreen', value: next })
    } else {
      // 未连上游戏服务时本地兜底，保证按钮仍可用
      applyFullscreen(next)
    }
  })

  // 收到服务端的外壳控制指令后执行
  function handleShellControl (msg) {
    if (msg.action === 'fullscreen') applyFullscreen(!!msg.value)
  }

  // 真正触发全屏：iframe 内交给外壳处理（作用于游戏区域），独立标签页作用于自身文档
  function applyFullscreen (on) {
    if (inIframe) {
      window.parent.postMessage({ type: 'FULLSCREEN_REQUEST', value: on }, '*')
      return
    }
    if (on) {
      const el = document.documentElement
      const req = el.requestFullscreen || el.webkitRequestFullscreen
      if (req) {
        const task = req.call(el)
        if (task && task.catch) task.catch(() => {})
      }
    } else if (document.fullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document)
    }
  }

  // 同步按钮图标：全屏时显示“退出全屏”
  function setFullscreenState (on) {
    isFullscreen = on
    fullscreenBtn.classList.toggle('isFullscreen', on)
    fullscreenBtn.title = on ? '退出全屏' : '全屏'
    fullscreenBtn.setAttribute('aria-label', on ? '退出全屏' : '全屏')
  }

  // 独立标签页用自身的 fullscreenchange 跟踪状态（含 ESC 退出）；iframe 内由外壳告知
  if (!inIframe) {
    document.addEventListener('fullscreenchange', () => {
      setFullscreenState(Boolean(document.fullscreenElement))
    })
  }

  document.getElementById('btnLeaveSeat').onclick = () => send({ type: 'leave_seat' })
  document.getElementById('btnStart').onclick = () => send({ type: 'ready' })
  document.getElementById('btnUndo').onclick = () => send({ type: 'undo' })
  document.getElementById('btnPass').onclick = () => send({ type: 'pass' })
  document.getElementById('btnResign').onclick = () => send({ type: 'resign' })

  // 终局弹窗操作
  document.getElementById('btnResetGame').onclick = () => {
    hideResult()
    send({ type: 'reset' })
  }
  document.getElementById('btnCloseResult').onclick = () => hideResult()
  document.getElementById('resultOverlay').addEventListener('click', event => {
    if (event.target.id === 'resultOverlay') hideResult()
  })

  // ---------- 启动 ----------

  // 每 250ms 重绘一次：回合倒计时（座位头像上方）+ 本局用时（顶部）
  setInterval(() => {
    tickCountdown()
    tickGameTime()
  }, 250)

  if (inIframe) {
    // 模板A：先告诉外壳已就绪，再主动要令牌
    window.parent.postMessage({ type: 'READY' }, '*')
    setTimeout(requestTokenFromShell, 300)
  } else {
    // 模板B：用 URL fragment 中的票据兑换
    exchangeTicket()
  }
})()
</script>
</body>
</html>
